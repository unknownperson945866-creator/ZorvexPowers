settings:
  one-power-per-player: true
  save-interval-seconds: 60

messages:
  prefix: "&8[&5Zorvex Powers&8] &r"
  no-permission: "&cYou don't have permission."
  player-only: "&cThis command can only be used by a player."
  no-power: "&cYou don't have a power yet."
  power-assigned: "&aYour power is now &d%power%&a."
  power-removed: "&cYour power was removed."
  reloaded: "&aConfiguration reloaded."

powers:
  AGNI:
    display-name: "&cAgni"
    description: "&7Master the heat of fire."
  BOREAS:
    display-name: "&bBoreas"
    description: "&7Command the freezing wind."
  OCEANIC:
    display-name: "&3Oceanic"
    description: "&7Harness the force of water."
  EOS:
    display-name: "&eEos"
    description: "&7Channel radiant energy."
  YMIR:
    display-name: "&9Ymir"
    description: "&7Wield ancient frost."
  CORROSIVE:
    display-name: "&2Corrosive"
    description: "&7Control corrosive nature."
  ASTRAEUS:
    display-name: "&dAstraeus"
    description: "&7Draw power from the cosmos."
  CHAINED:
    display-name: "&8Chained"
    description: "&7Bend shadow and binding energy."
