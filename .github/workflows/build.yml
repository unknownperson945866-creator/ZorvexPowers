name: Build Zorvex Powers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Paper plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Build Fabric client mod
        run: gradle --no-daemon -p fabric-client build
      - name: Upload Paper plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZorvexPowers-Paper
          path: target/ZorvexPowers-1.0.0.jar
      - name: Upload Fabric client mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZorvexPowers-Fabric-26.3
          path: fabric-client/build/libs/zorvex-powers-client-1.0.0.jar
