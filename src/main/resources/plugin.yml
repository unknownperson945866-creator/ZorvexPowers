name: ZorvexPowers
version: 2.0.0
main: fun.zorvex.powers.ZorvexPowers
api-version: '26.3'
authors: [Zorvex]
description: Transferable item-based powers for Zorvex SMP.
commands:
  powers:
    description: Check or activate the power item in your main hand.
    usage: /powers [cast]
    aliases: [power, zpowers]
  zorvexpowers:
    description: Admin commands for Zorvex power items.
    usage: /zp <reload|give|remove|list>
    aliases: [zp]
    permission: zorvexpowers.admin
permissions:
  zorvexpowers.use:
    description: Allows use of power items.
    default: true
  zorvexpowers.admin:
    description: Allows administration of Zorvex Powers.
    default: op
